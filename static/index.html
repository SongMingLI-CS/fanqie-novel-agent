<!doctype html><meta charset="utf-8"><title>Novel Agent</title>
<main><h1>Novel Agent</h1><p>半自动创作：生成 → 审查 → 导出 → 人工发布确认。</p><button id="refresh">刷新小说</button><button id="generate">生成下一章</button><button id="pause">暂停/继续</button><pre id="out">加载中…</pre><script>
const out=document.querySelector('#out');let selected; async function refresh(){const r=await fetch('/api/novels');const xs=await r.json();selected=xs[0];out.textContent=JSON.stringify(xs,null,2);if(selected){const c=await fetch('/api/novels/'+selected.id+'/chapters');out.textContent+='\n\n章节：\n'+JSON.stringify(await c.json(),null,2)}} document.querySelector('#refresh').onclick=refresh; document.querySelector('#generate').onclick=async()=>{if(selected) await fetch('/api/novels/'+selected.id+'/chapters/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});refresh()};document.querySelector('#pause').onclick=async()=>{if(selected) await fetch('/api/novels/'+selected.id+'/'+(selected.paused?'continue':'pause'),{method:'POST'});refresh()}; refresh();
</script>
