<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Novel Agent</title>
<style>body{font:15px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem}button{margin:.25rem;padding:.45rem .7rem}textarea{width:100%;min-height:14rem}article,section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}pre{white-space:pre-wrap;background:#f5f5f5;padding:1rem}</style>
<main><h1>Novel Agent</h1><p>半自动流程：生成 → 审查 → 人工审核 → 导出 → 目标平台手动发布 → 回系统确认。</p>
<section><label>小说 <select id="novels"></select></label> <button id="refresh">刷新</button> <button id="pause">暂停/继续</button> <button id="generate">生成下一章</button></section>
<section><h2>Story Bible</h2><textarea id="bible"></textarea><button id="saveBible">保存新版本</button></section>
<section><h2>章节</h2><div id="chapters">加载中…</div></section><pre id="error"></pre></main>
<script>
const $=id=>document.getElementById(id),state={};const esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const err=e=>$('error').textContent=e;async function api(u,o){const r=await fetch(u,o),x=await r.json();if(!r.ok)throw Error(x.message||x.code);return x}
async function refresh(){try{const xs=await api('/api/novels');$('novels').innerHTML=xs.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}（第${esc(x.current_chapter)}章）</option>`).join('');state.novel=xs[0];if(!state.novel)return;$('bible').value=JSON.stringify(state.novel.story_bible,null,2);const cs=await api(`/api/novels/${state.novel.id}/chapters`);$('chapters').innerHTML=cs.map(c=>`<article><b>第${esc(c.number)}章 ${esc(c.title||'(未生成)')}</b> <code>${esc(c.status)}</code><p>${esc((c.content||'').slice(0,160))}</p>${c.content?`<button onclick="editDraft('${esc(c.id)}')">修改草稿</button><button onclick="reviewDraft('${esc(c.id)}')">重新审查</button><button onclick="exportDraft('${esc(c.novel_id)}',${esc(c.number)},'txt')">TXT</button><button onclick="exportDraft('${esc(c.novel_id)}',${esc(c.number)},'md')">Markdown</button><button onclick="exportDraft('${esc(c.novel_id)}',${esc(c.number)},'json')">JSON</button><button onclick="publishManual('${esc(c.novel_id)}',${esc(c.number)})">已人工发布</button>`:''}</article>`).join('')||'暂无章节'}catch(e){err(e)}}
async function editDraft(id){const content=prompt('输入新的正文');if(content!==null)await api('/api/chapters/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});refresh()}async function reviewDraft(id){await api('/api/chapters/'+id+'/review',{method:'POST'});refresh()}async function exportDraft(n,nr,format){const x=await api('/api/chapters/x/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({novelId:n,chapterNumber:nr,format})});alert('已导出：'+x.path);refresh()}async function publishManual(n,nr){const platform=prompt('人工发布平台名称');if(platform)await api('/api/chapters/x/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({novelId:n,chapterNumber:nr,platform,operator:'local-user',publishedAt:new Date().toISOString()})});refresh()}
$('refresh').onclick=refresh;$('generate').onclick=async()=>{await api(`/api/novels/${state.novel.id}/chapters/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});refresh()};$('pause').onclick=async()=>{await api(`/api/novels/${state.novel.id}/${state.novel.paused?'continue':'pause'}`,{method:'POST'});refresh()};$('saveBible').onclick=async()=>{try{await api(`/api/novels/${state.novel.id}/story-bible`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({storyBible:JSON.parse($('bible').value)})});refresh()}catch(e){err(e)}};refresh();
</script>
