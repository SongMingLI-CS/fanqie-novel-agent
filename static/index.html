<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Agent · 长篇小说多智能体创作控制台</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="progress" class="progress" hidden><div class="progress-bar"></div></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">📖</div>
    <div>
      <h1>Novel Agent</h1>
      <div class="sub">长篇小说多智能体创作控制台</div>
    </div>
  </div>
  <div class="topbar-right">
    <span id="connPill" class="pill"><span class="dot"></span> 检查连接…</span>
    <button id="themeBtn" class="icon-btn" title="切换深色/浅色主题">🌙</button>
    <details class="conn" id="connDetails">
      <summary class="icon-btn" title="访问凭证">🔑</summary>
      <div class="conn-pop">
        <h3>访问凭证</h3>
        <p>服务端设置 NOVEL_AUTH_TOKEN 后需在此填入，凭证会附加到每个请求。</p>
        <div class="row"><input id="authToken" type="password" placeholder="粘贴 NOVEL_AUTH_TOKEN" autocomplete="off"></div>
        <div class="row" style="margin-top:8px">
          <button id="saveToken" class="btn primary sm">保存凭证</button>
          <button id="clearToken" class="btn sm">清除</button>
        </div>
      </div>
    </details>
  </div>
</header>

<div id="banner" hidden></div>

<main class="layout">
  <aside class="sidebar">
    <section class="card panel">
      <div class="ph"><h2>📖 小说</h2><div class="spacer"></div><button id="toggleNew" class="btn ghost sm">＋ 新建</button></div>
      <div class="pb">
        <select id="novels"></select>
        <div class="novel-stats" id="novelStats"></div>
        <div class="row" style="margin-top:10px;gap:8px">
          <button id="generate" class="btn primary">＋ 生成下一章</button>
          <button id="pause" class="btn" hidden>⏸ 暂停</button>
          <button id="resume" class="btn success" hidden>▶️ 继续写作</button>
        </div>
      </div>
    </section>

    <div id="newPanel" class="card panel" hidden>
      <div class="ph"><h2>📖 新建小说</h2><div class="spacer"></div><button id="newClose" class="btn ghost sm">关闭 ✕</button></div>
      <div class="pb">
        <label class="f">书名（必填）<input id="newTitle" type="text" placeholder="例如：我在异世界装逼"></label>
        <label class="f">分类<input id="newGenre" type="text" placeholder="例如：异界幻想 / 无敌流"></label>
        <label class="f">卷名<input id="newVolume" type="text" placeholder="例如：第一卷"></label>
        <label class="f">世界观（JSON，可选）<textarea id="newBible" rows="6" class="mono" placeholder='{"mainline":"一句话主线"}'></textarea></label>
        <div style="text-align:right;margin-top:10px"><button id="createNovel" class="btn primary">🚀 创建小说</button></div>
      </div>
    </div>

    <section class="card panel">
      <div class="ph"><h2>⚙️ 生成参数</h2></div>
      <div class="pb">
        <label class="f">写作流程</label>
        <div class="flow">
          <label><input type="radio" name="flow" value="compose" checked> 单次合成</label>
          <label><input type="radio" name="flow" value="multi"> 大纲 → 正文</label>
          <label><input type="radio" name="flow" value="polish"> 大纲 → 正文 → 润色</label>
        </div>
        <label class="f">目标字数（可选）<input id="targetWords" type="text" placeholder="留空 = 按圣经设定"></label>
      </div>
    </section>

    <section class="card panel">
      <div class="ph"><h2>🧩 Agent 状态</h2><div class="spacer"></div><span id="busyTag" hidden class="badge b-active"><span class="spin"></span> 运行中</span></div>
      <div class="pb"><div id="timeline"></div></div>
    </section>

    <section class="card panel">
      <div class="ph"><h2>📚 章节</h2><span class="hint" id="chapterHint"></span></div>
      <div class="pb"><input id="chapterFilter" class="filter" type="text" placeholder="🔍 搜索章节（标题/序号/状态）" autocomplete="off"><div id="chapterList" class="chapter-list"></div></div>
    </section>

    <section class="card panel">
      <div class="ph"><h2>📊 任务与用量</h2></div>
      <div class="pb"><div id="jobs"></div><div id="usage"></div></div>
    </section>

    <section class="card panel">
      <div class="ph"><h2>📜 Story Bible</h2><span class="hint" id="bibleVersion"></span></div>
      <div class="pb">
        <div class="row" style="margin-bottom:8px;gap:8px">
          <button id="saveBible" class="btn primary sm">💾 保存</button>
          <button id="fmtBible" class="btn sm">格式化</button>
          <span id="dirtyTag" class="chip warn dirty-tag">● 有未保存修改</span>
        </div>
        <textarea id="bible" spellcheck="false" rows="12"></textarea>
      </div>
    </section>
  </aside>

  <section class="main">
    <div id="reader" class="reader-pane">
      <div class="empty big">📖</div>
      <p class="empty-sub">选择左侧章节开始阅读，或点击「＋ 生成下一章」开始创作。</p>
    </div>
  </section>
</main>

<div id="modal" hidden>
  <div class="modal-box" id="modalBox">
    <h3 id="modalTitle">标题<span class="spacer"></span><button class="btn ghost sm" id="modalClose">✕</button></h3>
    <div class="m-body" id="modalBody"></div>
    <div class="m-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
